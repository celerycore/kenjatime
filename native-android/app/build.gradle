plugins { id 'com.android.application' }

android {
    namespace 'io.github.celerycore.kenjatime.nativeprototype'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.celerycore.kenjatime.nativeprototype'
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        java.srcDir '../generated/java'
        res.srcDir '../generated/res'
        assets.srcDir '../generated/assets'
        jniLibs.srcDir '../generated/jniLibs'
    }
    // Upstream prebuilt libraries are extracted for loading; do not rewrite ELF files.
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    lint { abortOnError true; lintConfig file('../lint.xml') }
}
dependencies {
    implementation 'androidx.core:core:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
}
