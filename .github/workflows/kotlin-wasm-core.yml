name: Kotlin/Wasm fighting core
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kotlin-core/**'
      - 'src/core/kotlin-wasm-backend.js'
      - '.github/workflows/kotlin-wasm-core.yml'
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify deterministic Kotlin/JVM tests
        run: ./android/gradlew -p kotlin-core jvmTest --stacktrace
      - name: Build browser Kotlin/Wasm artifact
        run: ./android/gradlew -p kotlin-core wasmJsBrowserProductionWebpack --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-kotlin-wasm
          path: kotlin-core/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error
