name: Kotlin/Wasm fighting core
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'kotlin-core/**'
      - 'src/core/kotlin-wasm-backend.js'
      - 'scripts/kotlin/capture-mugen11-palette.py'
      - '.github/workflows/kotlin-wasm-core.yml'
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check opt-in JavaScript browser bridge
        run: node --test test/core/kotlin-wasm-backend.test.js test/core/kotlin-parity-status.test.js
      - name: Verify deterministic Kotlin/JVM tests
        run: ./android/gradlew -p kotlin-core jvmTest --stacktrace
      - name: Execute shared deterministic tests in Kotlin/Wasm Node
        run: ./android/gradlew -p kotlin-core wasmJsNodeTest --stacktrace
      - name: Build browser Kotlin/Wasm artifact
        run: ./android/gradlew -p kotlin-core wasmJsBrowserProductionWebpack --stacktrace
      - name: Execute the actual compiled Kotlin/Wasm JavaScript ABI
        run: node --experimental-wasm-modules scripts/core/verify-kotlin-wasm-module.mjs
      - name: Smoke and profile actual bundled KFM scripts inside compiled Wasm
        run: node --experimental-wasm-modules scripts/core/benchmark-kotlin-wasm.mjs
      - name: Package raw Kotlin/Wasm ESM exports and Wasm companion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kotlin-core/wasm-package
          RAW=$(find kotlin-core/build -type f -name 'kenjatime-kotlin-core.mjs' -print -quit)
          test -n "$RAW"
          cp "$(dirname "$RAW")"/kenjatime-kotlin-core* kotlin-core/wasm-package/
          ls -lh kotlin-core/wasm-package/
          test -f kotlin-core/wasm-package/kenjatime-kotlin-core.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-kotlin-wasm
          path: kotlin-core/wasm-package/
          if-no-files-found: error

  js-reference-baseline:
    name: Existing JavaScript/native capture baseline (NOT Kotlin parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Audit 16 native interactions against existing JS engine (known mismatches reported)
        continue-on-error: true
        run: npm run verify:core:interactions
      - name: Audit 147 recorded KFM scenarios against existing JS engine (not Kotlin parity)
        continue-on-error: true
        run: npm run verify:core:movesets
      - name: Exercise Rare Akuma synthetic and inventory regression suite in existing JS engine
        run: node --test test/core/rare-akuma-contract.test.js test/core/rare-akuma-compatibility.test.js test/core/rare-akuma-2026.test.js test/core/rare-akuma-dual.test.js test/core/rare-akuma-hardening.test.js test/core/rare-akuma-jump.test.js test/core/rare-akuma-ai-activation.test.js

  mugen11-palette-capture:
    name: Capture native MUGEN 1.1b1 hit and guard colors
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install display and pixel capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool python3-pil
      - name: Download verified reference and Wine runtime
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 2 https://gamebanana.com/dl/383804 -o mugen-11b1.zip
          curl --fail --silent --show-error --location --retry 2 https://github.com/Kron4ek/Wine-Builds/releases/download/proton-11.0-3/wine-proton-11.0-3-amd64-wow64.tar.xz -o wine.tar.xz
          sha256sum -c <<'SHA256'
          67f55cafa49107f29e4317a245e35b17a718044de8e88ee824ad64862667b356  mugen-11b1.zip
          152cfcbc7b5e97ab40bfb648aecb8f874fd4a17246b6491c77fe8295374c9718  wine.tar.xz
          SHA256
          mkdir wine
          tar -xJf wine.tar.xz --strip-components=1 -C wine
      - name: Advance the original executable one tick at a time
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINEDEBUG: -all
          WINEDLLOVERRIDES: 'mscoree,mshtml='
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/wine/bin:$PATH"
          xvfb-run -a -s '-screen 0 800x600x24' /usr/bin/python3 scripts/kotlin/capture-mugen11-palette.py "$RUNNER_TEMP/mugen-11b1.zip" | tee mugen11-palette.json
      - uses: actions/upload-artifact@v4
        with:
          name: mugen11-palette-trace
          path: mugen11-palette.json
          if-no-files-found: error
