name: Kenjatime PR17 R8 Benchmark Preview

on:
  push:
    branches: [feature/r8-benchmark-preview-20261112]
    paths:
      - 'src/**'
      - 'core/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - 'package.json'
      - 'releases/**'
      - 'package-lock.json'
      - 'vite.core.config.js'
      - '.github/workflows/r8-benchmark-preview.yml'
  # Publish after an R8 source PR is actually merged, not while a PR
  # is open. This complements push events and avoids relying on a manual
  # dispatch workflow that may not exist on the default branch.
  pull_request:
    types: [closed]
    branches: [feature/r8-benchmark-preview-20261112]
  workflow_dispatch:
  # The repository default branch is gh-pages. A thin default-branch
  # entrypoint calls this verified R8-only job; workflow_dispatch on a
  # non-default branch is not a reliable manual deployment mechanism.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: kenjatime-pr17-r8-benchmark-pages
  cancel-in-progress: true

jobs:
  verify-and-publish-r8-benchmark:
    # A closed but unmerged pull request must never publish the R8 site.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout PR17-derived benchmark source (never production gh-pages)
        uses: actions/checkout@v4
        with:
          ref: feature/r8-benchmark-preview-20261112
          persist-credentials: false
      - name: Record actual checked-out R8 source commit (not caller event SHA)
        shell: bash
        run: |
          set -euo pipefail
          test -f src/core/r8-benchmark.js
          test -f scripts/core/verify-r8-benchmark.py
          r8_sha="$(git rev-parse HEAD)"
          test -n "${r8_sha}"
          echo "R8_SOURCE_SHA=${r8_sha}" >> "$GITHUB_ENV"
          echo "R8_SOURCE_BRANCH=feature/r8-benchmark-preview-20261112" >> "$GITHUB_ENV"
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/feature/r8-benchmark-preview-20261112" ]]; then
            test "${r8_sha}" = "${GITHUB_SHA}"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Verify R8 formats, palette bindings, residency, Android archive chooser
        run: node --test test/core/indexed-r8-textures.test.js test/core/gpu-residency-regression.test.js test/core/archive-file-picker.test.js test/core/remote-archive.test.js test/core/nu13-upload-size.test.js test/core/r8-ko-adaptive.test.js test/core/r8-start-freeze.test.js
      - name: Verify MUGEN 1.1 helper state/negative-state/input parity
        run: node --test test/core/mugen11-compatibility-target.test.js test/core/mugen11-state-helper-parity.test.js test/core/mugen11-binding-parentvar-parity.test.js test/core/rare-akuma-compatibility.test.js
      - name: Verify native-documented TargetState, ChangeAnim2 and SelfState synthetic behavior
        run: npm run verify:core:mugen11-customstate
      - name: Verify MUGEN 1.1 StateDef facing and live target lifecycle
        run: node --test test/core/mugen11-facep2-target-lifecycle.test.js
      - name: Verify MUGEN 1.1 TargetDrop random keepone and reproducible helper selection
        run: node --test test/core/mugen11-targetdrop-selection.test.js
      - name: Verify MUGEN 1.1 HitDef P2 custom state and HitOverride ownership
        run: node --test test/core/mugen11-hitdef-p2-customstate.test.js
      - name: Verify MUGEN 1.1 P1 throw StateDef, HitOverride armor and ordered timing
        run: node --test test/core/mugen11-hitdef-p1stateno-movetype.test.js
      - name: Verify consolidated MUGEN 1.1 Mega Update and R8 preservation gates
        run: node --test test/core/mugen11-mega-integration.test.js
      - name: Generate labeled candidate (never a native reference trace)
        run: |
          node scripts/core/mugen11-targetstate-oracle.mjs --candidate /tmp/kenjatime-mugen11-customstate.json
          test -s /tmp/kenjatime-mugen11-customstate.json
          node --input-type=module -e 'import fs from "node:fs"; const j=JSON.parse(fs.readFileSync("/tmp/kenjatime-mugen11-customstate.json","utf8")); if(j.source!=="kenjatime-synthetic"||j.nativeMugen11Verified!==false)process.exit(1)'
      - name: Verify deterministic 60 Hz input replay and KFM combat hashes
        run: node --test test/core/deterministic-60hz.test.js test/core/frame-scheduler.test.js
      - name: Run complete Core unit regression suite
        run: npm run test:core
      - name: Build isolated Core benchmark assets
        run: npm run build:core
      - name: Verify browser startup and real fight
        run: |
          python -m pip install 'playwright>=1.57,<2'
          python -m playwright install --with-deps chromium
          npm run verify:core:browser
      - name: Verify live R8 benchmark and exported CSV
        run: python scripts/core/verify-r8-benchmark.py
      - name: Embed source identity and reject private character files
        run: |
          node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const bundle=JSON.parse(readFileSync("releases/kenjatime-mega-2026-11-13.json","utf8"));
            if(bundle.nativeMugen11Certified!==false||bundle.productionArcadeUpdated!==false||!bundle.features.includes("r8-mega-release-gate"))throw Error("Invalid Mega release safety manifest");
            writeFileSync("dist-core/build-info.json",JSON.stringify({
              repository:"celerycore/kenjatime",
              branch:process.env.R8_SOURCE_BRANCH,
              sourceCommit:process.env.R8_SOURCE_SHA,
              channel:"r8-benchmark-pr17",
              basedOnPR:17,
              benchmarkFeatures:bundle.features,
              releaseId:bundle.id,
              releaseDate:bundle.date,
              releaseSections:Object.keys(bundle.sections),
              nativeMugen11Certified:bundle.nativeMugen11Certified,
              productionArcadeUpdated:bundle.productionArcadeUpdated,
              privateCharactersIncluded:false,
              kotlinWasmDefault:false
            },null,2)+"\n");
          '
          test -f dist-core/index.html
          test -f dist-core/core/index.html
          test -f dist-core/build-info.json
          ! find dist-core -type f | grep -Ei '/(Ako|Asuna|Dark.Donald|Rare.Akuma|Nu.?13|Forest.of.King.Cruel)\.(zip|rar|7z)$'
      - name: Save independently verified browser build
        uses: actions/upload-artifact@v4
        with:
          name: kenjatime-pr17-r8-benchmark-site
          path: dist-core/
          retention-days: 14
          if-no-files-found: error
      - name: Checkout production Pages separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing-pages
          persist-credentials: true
      - name: Publish only /r8-benchmark/; preserve live and other preview pages
        shell: bash
        run: |
          set -euo pipefail
          test -f existing-pages/index.html
          test -f existing-pages/.nojekyll
          test -f existing-pages/arcade/core/index.html
          test -f existing-pages/core-test/core/index.html
          sha256sum existing-pages/index.html existing-pages/.nojekyll existing-pages/arcade/core/index.html existing-pages/core-test/core/index.html > /tmp/kenjatime-live-before
          mkdir -p existing-pages/r8-benchmark
          rsync -a --delete dist-core/ existing-pages/r8-benchmark/
          test -f existing-pages/r8-benchmark/core/index.html
          test -f existing-pages/r8-benchmark/build-info.json
          sha256sum -c /tmp/kenjatime-live-before
          cd existing-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- r8-benchmark
          if git diff --cached --quiet; then
            echo "No benchmark site changes needed."
          else
            if git diff --cached --name-only | grep -v '^r8-benchmark/'; then
              echo "Refusing to change files outside r8-benchmark" >&2
              exit 1
            fi
            git commit -m "Publish isolated PR17 R8 benchmark from ${R8_SOURCE_SHA}"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - name: Verify public benchmark belongs to this source commit
        shell: bash
        run: |
          set -euo pipefail
          base="https://celerycore.github.io/kenjatime/r8-benchmark"
          for attempt in $(seq 1 36); do
            metadata="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${base}/build-info.json?rev=${R8_SOURCE_SHA}" || true)"
            if [[ "$metadata" == *"$R8_SOURCE_SHA"* ]] && [[ "$metadata" == *'"basedOnPR": 17'* ]]; then
              curl -fsSL --max-time 20 "${base}/core/index.html" | grep -q 'Kenjatime Core'
              echo "VERIFIED: ${base}/core/index.html"
              exit 0
            fi
            sleep 10
          done
          echo "Public R8 benchmark source verification timed out" >&2
          exit 1
