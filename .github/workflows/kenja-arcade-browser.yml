name: Kenjatime Arcade browser preview
on:
  push:
    branches:
      - feature/kenjatime-arcade-browser-ui-20261111
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kenjatime-arcade-browser-preview
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Core browser dependencies
        run: npm ci
      - name: Assert character import, stage import and battle launcher were preserved
        run: node --test test/core/kenja-arcade.test.js test/core/round-readiness.test.js test/core/session.test.js test/rounds.test.js test/uploads.test.js test/core/large-sff-preview.test.js
      - name: Build standalone core browser engine and validate isolated artifacts
        run: npm run build:core
      - name: Install headless mobile and desktop browser QA
        run: |
          python -m pip install 'playwright>=1.57,<2'
          python -m playwright install --with-deps chromium
      - name: Exercise full browser setup and responsive arcade theme
        run: python scripts/core/verify-kenja-arcade.py
      - name: Stamp deployed build and expose compatibility boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          writeFileSync('dist-core/build-info.json',JSON.stringify({
            project:'Kenjatime Arcade Browser UI',
            source:'celerycore/kenjatime',
            sourceCommit:process.env.GITHUB_SHA,
            sourceBranch:process.env.GITHUB_REF_NAME,
            runtime:'unchanged JavaScript Core',
            kotlinWasmLive:false,
            futureDefaultCharacters:['Gart Bernstein','Edelweiss'],
            futureCharactersPlayable:false,
            thirdPartyFighterArchivesIncluded:false,
            importArchiveFeaturePreserved:true,
            stageImportFeaturePreserved:true
          },null,2)+'\n');
          NODE
          test -f dist-core/core/index.html
          test -f dist-core/provenance.json

      - name: Checkout existing public website without modifying the live page
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing-pages
          persist-credentials: true
      - name: Publish only /arcade/ website
        shell: bash
        run: |
          set -euo pipefail
          test -f existing-pages/index.html
          test -f existing-pages/.nojekyll
          mkdir -p existing-pages/arcade
          rsync -a --delete dist-core/ existing-pages/arcade/
          test -f existing-pages/arcade/core/index.html
          test -f existing-pages/arcade/index.html
          cd existing-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- arcade
          if git diff --cached --quiet; then
            echo "Arcade preview already up to date"
          else
            git commit -m "Publish Kenjatime Arcade preview from $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-arcade-browser-build
          path: dist-core/
          if-no-files-found: error
          retention-days: 14
      - name: Browser preview
        run: echo "https://celerycore.github.io/kenjatime/arcade/"
