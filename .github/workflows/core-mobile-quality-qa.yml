name: Kenjatime Core mobile performance regression
on:
  push:
    branches:
      - perf/core-mobile-adaptive-presentation-20261110
  pull_request:
    branches:
      - qa/rare-akuma-native-ai-jump-parity-20261110
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:core:compiled
      - run: npm run build:core
