name: Kenjatime Core browser QA preview
on:
  push:
    branches:
      - qa/core-browser-test-20261110
    paths:
      - 'src/**'
      - 'core/**'
      - 'scripts/core/**'
      - 'package*.json'
      - 'vite.core.config.js'
      - '.github/workflows/core-browser-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: core-browser-qa-preview
  cancel-in-progress: false
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:core:compiled
      - run: npm run build:core
      - run: python -m pip install 'playwright>=1.57,<2'
      - run: python -m playwright install --with-deps chromium
      - run: npm run verify:core:browser
      - name: Stamp source commit for preview verification
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            writeFileSync("dist-core/build-info.json",
              JSON.stringify({project:"Kenjatime Core browser QA",
                branch:process.env.GITHUB_REF_NAME,
                commit:process.env.GITHUB_SHA,
                build:"0.5.8-core-preview",
                characterArchivesIncluded:false,
                source:"celerycore/kenjatime"},null,2)+"\n");
          '
      - name: Checkout existing public site without replacing it
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing-pages
          persist-credentials: true
      - name: Publish only the isolated core-test directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p existing-pages/core-test
          rsync -a --delete dist-core/ existing-pages/core-test/
          cd existing-pages
          test -f index.html
          test -f .nojekyll
          test -f core-test/core/index.html
          test -f core-test/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- core-test
          if git diff --cached --quiet; then
            echo "Already published at this build revision."
          else
            git commit -m "Publish isolated Kenjatime Core browser QA preview from $GITHUB_SHA"
            git push origin HEAD:gh-pages
          fi
      - name: Preview address
        run: echo "Browser preview source staged at https://celerycore.github.io/kenjatime/core-test/"
