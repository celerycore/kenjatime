name: Local-only Core runtime handoff
on:
  push:
    branches: [feature/kotlin-wasm-blueprint-20261111]
    paths: ['.github/workflows/runtime-source-handoff.yml']
  workflow_dispatch:

jobs:
  portable-headless-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked runtime dependencies
        run: npm ci
      - name: Bundle executable feature-branch source and local dependencies
        run: |
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          mkdir -p /tmp/kenjatime-handoff
          tar -czf /tmp/kenjatime-handoff/runtime.tar.gz \
            SOURCE_COMMIT.txt src scripts/core test/core test/fixtures \
            public/kfm.zip package.json package-lock.json node_modules
          sha256sum /tmp/kenjatime-handoff/runtime.tar.gz
          du -h /tmp/kenjatime-handoff/runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-portable-core-for-local-validation
          path: /tmp/kenjatime-handoff/runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
