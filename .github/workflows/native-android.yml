name: Native Android prototype
on:
  workflow_dispatch:
  push:
    branches: [source/mugen-compatibility]
    paths:
      - 'native-android/**'
      - 'scripts/prepare-native-android.py'
      - 'scripts/verify-native-android.py'
      - '.github/workflows/native-android.yml'
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Prepare pinned upstream engine and wrapper
        run: python scripts/prepare-native-android.py
      - name: Test launcher/imports and build native APK
        run: cd native-android && ./gradlew :app:testDebugUnitTest assembleDebug lintDebug --console=plain
      - name: Verify native binaries, JNI, assets and APK
        run: python scripts/verify-native-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-native-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
