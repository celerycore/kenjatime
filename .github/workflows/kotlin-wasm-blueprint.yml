name: Kotlin WASM blueprint foundations
on:
  push:
    paths:
      - 'kotlin-engine/**'
      - '.github/workflows/kotlin-wasm-blueprint.yml'
  pull_request:
    paths:
      - 'kotlin-engine/**'
      - '.github/workflows/kotlin-wasm-blueprint.yml'
  workflow_dispatch:
jobs:
  deterministic-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: JVM deterministic core tests
        run: gradle jvmTest --stacktrace
      - name: Kotlin/Wasm Node tests
        run: gradle wasmJsNodeTest --stacktrace
      - name: Compile Kotlin/Wasm host executable
        run: gradle wasmJsNodeDevelopmentRun --stacktrace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install host adapter dependencies
        working-directory: .
        run: npm ci
      - name: Probe real Kotlin/Wasm JavaScript exports
        working-directory: .
        run: node scripts/core/verify-kotlin-wasm-native.mjs kotlin-engine/build
      - name: Preserve compiled combat module for private review
        uses: actions/upload-artifact@v4
        with:
          name: kenjatime-kotlin-wasm-combat-module
          path: kotlin-engine/build/compileSync/wasmJs/main/developmentExecutable/kotlin/
          if-no-files-found: error
          retention-days: 7

      - name: Package offline Core runner for original local character files
        working-directory: .
        run: |
          mkdir -p /tmp/kenjatime-local-handoff
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt
          tar -czf /tmp/kenjatime-local-handoff/runtime.tar.gz \
            SOURCE_COMMIT.txt src scripts/core test/core test/fixtures \
            public/kfm.zip package.json package-lock.json node_modules
          sha256sum /tmp/kenjatime-local-handoff/runtime.tar.gz
          du -h /tmp/kenjatime-local-handoff/runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-offline-headless-source-and-dependencies
          path: /tmp/kenjatime-local-handoff/runtime.tar.gz
          if-no-files-found: error
          retention-days: 1
