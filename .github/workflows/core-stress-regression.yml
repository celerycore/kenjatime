name: Kenjatime Core Stress Regression

on:
  push:
    branches:
      - feature/kotlin-wasm-blueprint-20261111
    paths:
      - 'src/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - '.github/workflows/core-stress-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - '.github/workflows/core-stress-regression.yml'
  workflow_dispatch:

jobs:
  combat-and-zss:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Projectile memory and broadphase regression
        run: node --test test/core/projectile-stress-optimization.test.js
      - name: Forest/Ako/Asuna GPU residency and native-scale camera tests
        run: node --test test/core/gpu-residency-regression.test.js test/core/legacy-stage-viewport-regression.test.js
      - name: Extended ZSS globals regression
        run: node --test test/core/extended-global-scheduler.test.js
      - name: Experimental Kotlin/Wasm host adapter parity
        run: node --test test/core/kotlin-wasm-combat-bridge.test.js
      - name: Real-package marathon CLI smoke test (synthetic KFM fixtures)
        run: node --test test/core/character-trio-cli.test.js
      - name: MUGEN 1.1 legacy compatibility target and helper visibility
        run: npm run verify:core:mugen11-target
      - name: Existing ZSS compatibility fixtures
        run: node --test test/core/zss.test.js
      - name: Full Core unit suite
        run: npm run test:core
      - name: Original interaction compatibility comparison (known baseline gap)
        run: npm run verify:core:interactions
        continue-on-error: true
      - name: KFM 147-scenario native comparison (known baseline gap)
        run: npm run verify:core:movesets
        continue-on-error: true

  synthetic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
      - name: Checkout unmodified comparison branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/kotlin-wasm-core-20261111
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix baseline
      - name: Baseline interaction comparison (diagnostic only)
        run: CORE_TRACE=1 npm run verify:core:interactions --prefix baseline
        continue-on-error: true
      - name: Baseline KFM comparison (diagnostic only)
        run: CORE_TRACE=1 npm run verify:core:movesets --prefix baseline
        continue-on-error: true
      - name: Compare candidate interactions with baseline
        run: |
          CORE_TRACE=1 npm run verify:core:interactions || true
          node scripts/core/compare-baseline-traces.mjs baseline/work/core/interactions-native-comparison.json work/core/interactions-native-comparison.json baseline/work/core work/core
      - name: Compare candidate KFM with baseline
        run: |
          CORE_TRACE=1 npm run verify:core:movesets || true
          node scripts/core/compare-baseline-traces.mjs baseline/work/core/kfm-classic-native-comparison.json work/core/kfm-classic-native-comparison.json baseline/work/core work/core
      - name: Benchmark baseline Core
        run: CORE_BENCH_SOURCE="$GITHUB_WORKSPACE/baseline" node --expose-gc scripts/core/benchmark-projectile-stress.mjs
      - name: Benchmark optimized Core
        run: node --expose-gc scripts/core/benchmark-projectile-stress.mjs
