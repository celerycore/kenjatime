name: Kenjatime Core Stress Regression

on:
  push:
    branches:
      - feature/kotlin-wasm-blueprint-20261111
    paths:
      - 'src/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - '.github/workflows/core-stress-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - '.github/workflows/core-stress-regression.yml'
  workflow_dispatch:

jobs:
  combat-and-zss:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Projectile memory and broadphase regression
        run: node --test test/core/projectile-stress-optimization.test.js
      - name: Extended ZSS globals regression
        run: node --test test/core/extended-global-scheduler.test.js
      - name: Existing ZSS compatibility fixtures
        run: node --test test/core/zss.test.js
      - name: Full Core unit suite
        run: npm run test:core
      - name: Original interaction compatibility comparison
        run: npm run verify:core:interactions
      - name: KFM 147-scenario native compatibility gate
        run: npm run verify:core:movesets

  synthetic-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout optimized branch
        uses: actions/checkout@v4
      - name: Checkout unmodified comparison branch
        uses: actions/checkout@v4
        with:
          ref: rewrite/kotlin-wasm-core-20261111
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm ci --prefix baseline
      - name: Benchmark baseline Core
        run: CORE_BENCH_SOURCE="$GITHUB_WORKSPACE/baseline" node --expose-gc scripts/core/benchmark-projectile-stress.mjs
      - name: Benchmark optimized Core
        run: node --expose-gc scripts/core/benchmark-projectile-stress.mjs
