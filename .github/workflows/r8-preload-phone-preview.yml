name: Kenjatime R8 Preload NOW LOADING Phone QA

on:
  push:
    branches: [perf/r8-preload-now-loading-20261114]
    paths:
      - 'src/**'
      - 'core/**'
      - 'test/core/**'
      - 'scripts/core/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.core.config.js'
      - '.github/workflows/r8-preload-phone-preview.yml'

permissions:
  contents: write

concurrency:
  group: kenjatime-r8-preload-phone-preview
  cancel-in-progress: true

jobs:
  verify-and-publish-isolated-phone-preview:
    if: github.ref == 'refs/heads/perf/r8-preload-now-loading-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated Android performance review branch
        uses: actions/checkout@v4
        with:
          ref: perf/r8-preload-now-loading-20261114
          persist-credentials: false
      - name: Verify source commit identity
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$GITHUB_SHA"
          echo "PRELOAD_SHA=$source_sha" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Verify indexed R8, PalFX bindings, texture eviction and video recovery
        run: node --test test/core/indexed-r8-textures.test.js test/core/gpu-residency-regression.test.js test/core/r8-video-residency.test.js test/core/r8-android-csv-performance.test.js test/core/r8-texture-reuse.test.js test/core/r8-visible-indexed-fastpath.test.js test/core/r8-preload-loading.test.js
      - name: Run complete Core regression suite
        run: npm run test:core
      - name: Build isolated benchmark
        run: npm run build:core
      - name: Verify real WebGL2 shader pixels, KFM fight and CSV
        run: |
          python -m pip install 'playwright>=1.57,<2'
          python -m playwright install --with-deps chromium
          python scripts/core/verify-r8-gpu-pixels.py
          npm run verify:core:browser
          python scripts/core/verify-r8-benchmark.py
      - name: Mark review-only build and reject private character packages
        run: |
          node --input-type=module -e '
            import {writeFileSync} from "node:fs";
            writeFileSync("dist-core/build-info.json",JSON.stringify({
              repository:"celerycore/kenjatime",sourceBranch:"perf/r8-preload-now-loading-20261114",
              sourceCommit:process.env.PRELOAD_SHA,channel:"r8-preload-qa",
              productionArcadeUpdated:false,physicalAndroidVerified:false,
              nativeMugen11Certified:false,kotlinWasmDefault:false,
              scope:"Review-only phone preview; not the production engine"
            },null,2)+"\n");
          '
          test -f dist-core/core/index.html
          ! find dist-core -type f | grep -Ei '/(Ako|Asuna|Dark.Donald|Rare.Akuma|Nu.?13|Forest.of.King.Cruel)\.(zip|rar|7z)$'
      - name: Save independent phone-QA archive
        uses: actions/upload-artifact@v4
        with:
          name: kenjatime-r8-preload-phone-qa
          path: dist-core/
          retention-days: 14
          if-no-files-found: error
      - name: Checkout production Pages for isolated path publishing
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: existing-pages
          persist-credentials: true
      - name: Publish ONLY /r8-preload-phone-preview/ (guard live Core checksums)
        run: |
          set -euo pipefail
          for path in index.html .nojekyll arcade/core/index.html core-test/core/index.html; do
            test -f "existing-pages/$path"
          done
          sha256sum existing-pages/index.html existing-pages/.nojekyll existing-pages/arcade/core/index.html existing-pages/core-test/core/index.html > /tmp/kenjatime-android-perf-live-checksums
          mkdir -p existing-pages/r8-preload-phone-preview
          rsync -a --delete dist-core/ existing-pages/r8-preload-phone-preview/
          test -f existing-pages/r8-preload-phone-preview/core/index.html
          test -f existing-pages/r8-preload-phone-preview/build-info.json
          sha256sum -c /tmp/kenjatime-android-perf-live-checksums
          cd existing-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- r8-preload-phone-preview
          if git diff --cached --quiet; then
            echo "Isolated phone QA already current."
          else
            if git diff --cached --name-only | grep -v '^r8-preload-phone-preview/'; then
              echo "Refusing to touch paths outside Android performance preview." >&2
              exit 1
            fi
            git commit -m "Publish isolated Kenjatime Android performance phone QA $PRELOAD_SHA"
            git pull --rebase origin gh-pages
            git push origin HEAD:gh-pages
          fi
      - name: Verify public QA site matches exact tested commit
        run: |
          set -euo pipefail
          base="https://celerycore.github.io/kenjatime/r8-preload-phone-preview"
          for attempt in $(seq 1 36); do
            response="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$base/build-info.json?rev=$PRELOAD_SHA" || true)"
            if [[ "$response" == *"$PRELOAD_SHA"* ]] && [[ "$response" == *'"channel": "r8-preload-qa"'* ]]; then
              curl -fsSL --max-time 20 "$base/core/index.html" | grep -q 'Kenjatime Core'
              echo "VERIFIED: $base/core/index.html for $PRELOAD_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "Isolated public phone QA did not report this commit." >&2
          exit 1
