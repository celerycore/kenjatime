name: MUGEN compatibility checks
on:
  push:
    branches: [source/helper-projectile-interactions]
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compatibility
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: arena-build
          path: dist/
