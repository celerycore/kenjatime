name: Independent engine preview
on:
  workflow_dispatch:
  push:
    branches: [source/independent-engine]
    paths:
      [
        "src/**",
        "core/**",
        "scripts/core/**",
        "test/**",
        "android/**",
        "*package*.json",
        "vite.core.config.js",
        "capacitor.core.config.json",
        ".github/workflows/core-engine.yml",
      ]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:core
      - run: npm run test:core:compiled
      - run: npm run verify:core:interactions
      - name: Verify all captured moveset scenarios
        run: npm run verify:core:movesets
      - name: Record authored CPU load metrics (not phone FPS)
        run: npm run benchmark:core:combat
      - name: Record animation trigger metrics (not phone FPS)
        run: npm run benchmark:core:animation
      - run: npm run build:core
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run verify:core:browser
      - run: CORE_MAIN=1 npm run verify:core:browser
      - run: CORE_WORKER_FAIL=1 npm run verify:core:browser
      - run: npm run verify:core:archives
      - uses: actions/upload-artifact@v4
        with:
          name: independent-web-preview-and-evidence
          path: |
            dist-core
            work/core/*evidence.json
            work/core/*native-comparison.json
            work/core/combat-benchmark.json
            work/core/animation-benchmark.json
            work/core/*.png
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: npm ci
      - run: npm run android:core:copy
      - run: cd android && ./gradlew -PkenjatimeCorePreview=true assembleDebug testDebugUnitTest lintDebug --console=plain
      - run: python scripts/core/verify-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: independent-android-preview
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            work/core/android-evidence.json
