name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [source/mugen-compatibility]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'mobile/**'
      - '*package*.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: npm ci
      - run: npm test
      - name: Build APK
        run: npm run android:debug
      - name: Native startup regression
        run: cd android && ./gradlew :app:testDebugUnitTest --console=plain
      - name: Android lint
        run: cd android && ./gradlew lintDebug --console=plain
      - name: Verify signed APK and offline assets
        run: python scripts/verify-android-apk.py
      - uses: actions/upload-artifact@v4
        with:
          name: kenjatime-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
