name: Go browser engine
on:
  workflow_dispatch:
  push:
    branches: [source/mugen-compatibility]
    paths:
      - 'engine/**'
      - 'src/**'
      - '*package*.json'
      - 'test/support-archives.test.js'
      - 'test/module-music.test.js'
      - 'public/engine/**'
      - 'native-android/ui/**'
      - 'scripts/verify-media-support.py'
      - 'scripts/verify-support-archives.py'
      - 'scripts/generate-support-archives.mjs'
      - 'test/fixtures/media/**'
      - 'test/fixtures/support-rar/**'
      - 'scripts/verify-go-gpu.py'
      - 'test/go-gpu.test.js'
      - 'test/pcm.test.js'
      - 'test/render-target.test.js'
      - 'scripts/verify-browser-runtime.py'
      - 'scripts/verify-embedded-battle.py'
      - 'scripts/verify-mobile-archives.py'
      - 'scripts/verify-library-reset.py'
      - 'scripts/verify-startup-diagnostics.py'
      - 'test/startup-diagnostics.test.js'
      - 'test/fixtures/webgl-*'
      - 'scripts/verify-go-engine.py'
      - 'scripts/verify-go-presentation.py'
      - 'scripts/prepare-kenjatime-ui.py'
      - 'scripts/build-go-engine.py'
      - '.github/workflows/go-engine.yml'
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.12
          cache: false
      - run: npm ci && npm run build
      - run: python scripts/prepare-native-android.py
      - name: Rebuild pinned Go engine and compare the shipped binary
        run: |
          cp public/engine/ikemen.wasm.bin /tmp/shipped-engine.wasm.bin
          KENJATIME_GO="$(command -v go)" python scripts/build-go-engine.py
          cmp /tmp/shipped-engine.wasm.bin public/engine/ikemen.wasm.bin
      - run: npm test
      - run: npm run build
      - run: pip install playwright pillow
      - run: python -m playwright install --with-deps chromium
      - name: Compare ordered GPU commands against the pinned WebGL reference
        run: python scripts/verify-go-gpu.py
      - name: Check multipart/encrypted installs, exact downloads and re-imports
        run: python scripts/verify-support-archives.py
      - name: Check tracker music, video pixels/audio and three light shadow types
        run: python scripts/verify-media-support.py
      - name: Check low quality shadows and main-thread media fallback
        run: |
          python scripts/verify-media-support.py --group shadow --quality low
          python scripts/verify-media-support.py --group all --main-thread
      - name: Execute Go matches and verify no stock UI
        run: python scripts/verify-go-engine.py
      - name: Check fighter framing, HUD pixels, sparks and stage PCM output
        run: python scripts/verify-go-presentation.py
      - name: Check worker ownership, standard gamepads, quality mode and teardown
        run: python scripts/verify-browser-runtime.py
      - name: Check same-page phone fights without popup or fullscreen permission
        run: python scripts/verify-embedded-battle.py
      - name: Check imported archive downloads and library upgrades
        run: python scripts/verify-mobile-archives.py
      - name: Check library reset and recovery from hung storage
        run: python scripts/verify-library-reset.py
      - name: Check startup diagnostics, cold starts, library upgrades and large libraries
        run: python scripts/verify-startup-diagnostics.py
      - name: Check device-native 48 kHz audio
        run: MUGEN_QA_AUDIO_RATE=48000 python scripts/verify-go-presentation.py
      - name: Check the main-thread and ScriptProcessor compatibility fallback
        run: MUGEN_QA_MAIN_FALLBACK=1 MUGEN_QA_SCRIPT_AUDIO=1 python scripts/verify-go-presentation.py
